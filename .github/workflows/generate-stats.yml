name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'  # A cada 6 horas
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/stats.svg
          committer_message: "Update stats images"

          # Tema escuro como base (equivalente ao bg_color: 0d1117)
          config_theme: dark
          config_timezone: America/Bahia

          # Seções exibidas (equivalente ao show_icons + stats gerais)
          base: header, activity, community, repositories, metadata

          # Linguagens mais usadas (equivalente ao "Top Languages" / layout compact)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8

          # Paleta laranja customizada (equivalente ao title_color/icon_color: d88800)
          extras_css: |
            h2, h3, .field.large {
              color: #d88800 !important;
            }
            svg[data-icon] {
              fill: #d88800 !important;
            }
            body, .card {
              background-color: #0d1117 !important;
              color: #c9d1d9 !important;
            }