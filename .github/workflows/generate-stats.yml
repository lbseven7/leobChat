name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'  # A cada 6 horas
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Stats Images
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/stats.svg
          committer_message: "Update stats images"

          config_timezone: America/Bahia

          base: header, activity, community, repositories, metadata

          extras_css: |
            h2, h3, .field.large {
              color: #d88800 !important;
            }
            svg[data-icon] {
              fill: #d88800 !important;
            }
            body, .card {
              background-color: #0d1117 !important;
              color: #c9d1d9 !important;
            }

      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/languages.svg
          committer_message: "Update languages image"

          config_timezone: America/Bahia

          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8

          extras_css: |
            h2, h3, .field.large {
              color: #d88800 !important;
            }
            body, .card {
              background-color: #0d1117 !important;
              color: #c9d1d9 !important;
            }